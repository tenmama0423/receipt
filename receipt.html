<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>領収書発行ツール</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Hiragino Mincho ProN", "Yu Mincho", "MS Mincho", serif; background: #f0f0f0; }

  /* ===== 管理者設定パネル ===== */
  #admin-panel {
    max-width: 560px;
    margin: 30px auto;
    background: #fff;
    border-radius: 10px;
    padding: 30px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.12);
  }
  #admin-panel h2 {
    font-size: 18px;
    margin-bottom: 20px;
    color: #333;
    border-bottom: 2px solid #c00;
    padding-bottom: 8px;
  }
  .form-row { margin-bottom: 16px; }
  .form-row label { display: block; font-size: 13px; color: #555; margin-bottom: 4px; }
  .form-row input, .form-row textarea {
    width: 100%; padding: 9px 12px;
    border: 1px solid #ccc; border-radius: 6px;
    font-size: 15px; font-family: inherit;
  }
  .form-row textarea { height: 70px; resize: vertical; }
  #btn-generate-link {
    width: 100%; padding: 12px;
    background: #c00; color: #fff;
    border: none; border-radius: 6px;
    font-size: 16px; cursor: pointer;
    margin-top: 8px;
  }
  #btn-generate-link:hover { background: #a00; }
  #link-output {
    margin-top: 16px; padding: 12px;
    background: #f8f8f8; border: 1px solid #ddd;
    border-radius: 6px; word-break: break-all;
    font-size: 13px; display: none;
  }
  #link-output a { color: #c00; }
  #copy-btn {
    margin-top: 8px; padding: 7px 16px;
    background: #555; color: #fff;
    border: none; border-radius: 5px;
    cursor: pointer; font-size: 13px;
  }

  /* ===== 領収書入力フォーム ===== */
  #receipt-form-panel {
    max-width: 560px;
    margin: 30px auto;
    background: #fff;
    border-radius: 10px;
    padding: 30px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.12);
    display: none;
  }
  #receipt-form-panel h2 {
    font-size: 18px;
    margin-bottom: 20px;
    color: #333;
    border-bottom: 2px solid #c00;
    padding-bottom: 8px;
  }
  #btn-preview {
    width: 100%; padding: 12px;
    background: #c00; color: #fff;
    border: none; border-radius: 6px;
    font-size: 16px; cursor: pointer;
    margin-top: 8px;
  }
  #btn-preview:hover { background: #a00; }

  /* ===== 領収書プレビュー ===== */
  #preview-area { display: none; }
  #receipt-wrapper {
    max-width: 620px;
    margin: 30px auto 10px;
    padding: 0 16px;
  }

  /* ===== 領収書本体 ===== */
  #receipt {
    width: 580px;
    min-height: 400px;
    background: #fff;
    border: 2px solid #222;
    padding: 36px 44px 40px;
    position: relative;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "MS Mincho", serif;
  }
  .receipt-title {
    text-align: center;
    font-size: 28px;
    font-weight: bold;
    letter-spacing: 6px;
    margin-bottom: 24px;
    color: #111;
  }
  .receipt-date {
    text-align: right;
    font-size: 13px;
    color: #333;
    margin-bottom: 10px;
  }
  .receipt-no {
    text-align: right;
    font-size: 12px;
    color: #555;
    margin-bottom: 18px;
  }
  .receipt-addressee {
    font-size: 20px;
    font-weight: bold;
    border-bottom: 2px solid #111;
    padding-bottom: 4px;
    margin-bottom: 20px;
    color: #111;
  }
  .receipt-amount-label {
    font-size: 13px;
    color: #555;
    margin-bottom: 4px;
  }
  .receipt-amount {
    font-size: 32px;
    font-weight: bold;
    color: #111;
    margin-bottom: 20px;
    letter-spacing: 2px;
  }
  .receipt-subject-label {
    font-size: 13px;
    color: #555;
    margin-bottom: 4px;
  }
  .receipt-subject {
    font-size: 16px;
    color: #111;
    margin-bottom: 6px;
    padding: 6px 10px;
    border: 1px solid #ccc;
    background: #fafafa;
  }
  .receipt-note {
    font-size: 13px;
    color: #555;
    margin-bottom: 24px;
  }
  .receipt-issuer-block {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 16px;
    margin-top: 10px;
  }
  .receipt-issuer-text {
    text-align: right;
  }
  .receipt-issuer-name {
    font-size: 16px;
    font-weight: bold;
    color: #111;
  }
  .receipt-issuer-sub {
    font-size: 12px;
    color: #555;
    margin-top: 2px;
  }
  .hanko-img {
    width: 80px;
    height: 80px;
    opacity: 0.85;
  }
  .receipt-footer {
    margin-top: 28px;
    border-top: 1px solid #ccc;
    padding-top: 10px;
    font-size: 11px;
    color: #888;
    text-align: center;
  }

  /* ===== ダウンロードボタン ===== */
  .dl-buttons {
    max-width: 580px;
    margin: 0 auto 40px;
    padding: 0 16px;
    display: flex;
    gap: 12px;
  }
  .dl-btn {
    flex: 1; padding: 13px;
    border: none; border-radius: 6px;
    font-size: 15px; cursor: pointer;
    font-family: inherit;
  }
  #btn-dl-pdf { background: #c00; color: #fff; }
  #btn-dl-pdf:hover { background: #a00; }
  #btn-dl-img { background: #444; color: #fff; }
  #btn-dl-img:hover { background: #222; }
  #btn-back { background: #eee; color: #333; }
  #btn-back:hover { background: #ddd; }

  @media print {
    body * { visibility: hidden; }
    #receipt, #receipt * { visibility: visible; }
    #receipt { position: absolute; left: 0; top: 0; border: none; }
  }
</style>
</head>
<body>

<!-- ===== 管理者設定パネル ===== -->
<div id="admin-panel">
  <h2>&#9881; 領収書設定（管理者用）</h2>
  <div class="form-row">
    <label>タイトル（例：セミナー参加費）</label>
    <input type="text" id="cfg-title" placeholder="〇〇セミナー参加費" value="">
  </div>
  <div class="form-row">
    <label>金額（数字のみ、例：5000）</label>
    <input type="number" id="cfg-amount" placeholder="5000" value="">
  </div>
  <div class="form-row">
    <label>発行元（会社名・氏名）</label>
    <input type="text" id="cfg-issuer" placeholder="株式会社amanagi" value="">
  </div>
  <div class="form-row">
    <label>発行元サブ情報（住所・電話など、任意）</label>
    <textarea id="cfg-issuer-sub" placeholder="〒000-0000 東京都〇〇区...&#10;TEL: 00-0000-0000"></textarea>
  </div>
  <div class="form-row">
    <label>但し書き（例：上記正に領収いたしました）</label>
    <input type="text" id="cfg-note" placeholder="上記正に領収いたしました" value="上記正に領収いたしました">
  </div>
  <button id="btn-generate-link" onclick="generateLink()">&#128279; 参加者用リンクを生成</button>
  <div id="link-output">
    <div id="link-text"></div>
    <button id="copy-btn" onclick="copyLink()">コピー</button>
  </div>
</div>

<!-- ===== 参加者：宛先入力フォーム ===== -->
<div id="receipt-form-panel">
  <h2>&#128196; 領収書の発行</h2>
  <div class="form-row">
    <label>宛名（お名前または会社名）</label>
    <input type="text" id="input-addressee" placeholder="山田 太郎 様" oninput="updateAddresseePreview()">
  </div>
  <button id="btn-preview" onclick="showPreview()">領収書を作成する</button>
</div>

<!-- ===== 領収書プレビュー ===== -->

    <div id="receipt">
      <div class="receipt-date" id="r-date"></div>
      <div class="receipt-no" id="r-no"></div>

      <div class="receipt-addressee" id="r-addressee"></div>
      <div class="receipt-amount-label">金額</div>
      <div class="receipt-amount" id="r-amount"></div>
      <div class="receipt-subject-label">但し書き</div>
      <div class="receipt-subject" id="r-subject"></div>
      <div class="receipt-note" id="r-note"></div>
      <div class="receipt-issuer-block">
        <div class="receipt-issuer-text">

<script>
// ===== 状態管理 =====
let config = {};

// ===== URLパラメータ解析 =====
function getParams() {
  const params = {};
  const search = location.search.slice(1);
  if (!search) return params;
  search.split('&').forEach(pair => {
    const [k, v] = pair.split('=');
    if (k) params[decodeURIComponent(k)] = decodeURIComponent(v || '');
  });
  return params;
}

// ===== 初期化 =====
window.onload = function() {
  const params = getParams();
  if (params.mode === 'issue') {
    // 参加者モード
    config = {
      title: params.title || '領収書',
      amount: params.amount || '0',
      issuer: params.issuer || '',
      issuerSub: params.issuerSub || '',
      note: params.note || '上記正に領収いたしました'
    };
    document.getElementById('admin-panel').style.display = 'none';
    document.getElementById('receipt-form-panel').style.display = 'block';
  } else {
    // 管理者モード
    document.getElementById('admin-panel').style.display = 'block';
    document.getElementById('receipt-form-panel').style.display = 'none';
  }
};

// ===== リンク生成 =====
function generateLink() {
  const title = document.getElementById('cfg-title').value.trim();
  const amount = document.getElementById('cfg-amount').value.trim();
  const issuer = document.getElementById('cfg-issuer').value.trim();
  const issuerSub = document.getElementById('cfg-issuer-sub').value.trim();
  const note = document.getElementById('cfg-note').value.trim();

  if (!title || !amount || !issuer) {
    alert('タイトル・金額・発行元は必須です');
    return;
  }

  const base = location.href.split('?')[0];
  const params = new URLSearchParams({
    mode: 'issue',
    title, amount, issuer, issuerSub, note
  });
  const link = base + '?' + params.toString();

  const box = document.getElementById('link-output');
  document.getElementById('link-text').innerHTML = '<a href="' + link + '" target="_blank">' + link + '</a>';
  box.style.display = 'block';
  window._generatedLink = link;
}

function copyLink() {
  if (window._generatedLink) {
    navigator.clipboard.writeText(window._generatedLink).then(() => {
      document.getElementById('copy-btn').textContent = 'コピーしました！';
      setTimeout(() => { document.getElementById('copy-btn').textContent = 'コピー'; }, 2000);
    });
  }
}

// ===== 領収書プレビュー表示 =====
function showPreview() {
  const addressee = document.getElementById('input-addressee').value.trim();
  if (!addressee) {
    alert('宛名を入力してください');
    return;
  }

  // 日付
  const now = new Date();
  const dateStr = now.getFullYear() + '年' + (now.getMonth()+1) + '月' + now.getDate() + '日';
  // 領収書番号（日時ベース）
  const no = 'No.' + now.getFullYear().toString().slice(2)
    + String(now.getMonth()+1).padStart(2,'0')
    + String(now.getDate()).padStart(2,'0')
    + '-' + String(now.getHours()).padStart(2,'0')
    + String(now.getMinutes()).padStart(2,'0')
    + String(now.getSeconds()).padStart(2,'0');

  // 金額フォーマット
  const amountNum = parseInt(config.amount, 10);
  const amountStr = '¥ ' + amountNum.toLocaleString('ja-JP') + ' -';

  document.getElementById('r-date').textContent = dateStr;
  document.getElementById('r-no').textContent = no;
  document.getElementById('r-title').textContent = '領　収　書';
  document.getElementById('r-addressee').textContent = addressee + ' 御中';
  document.getElementById('r-amount').textContent = amountStr;
  document.getElementById('r-subject').textContent = config.title;
  document.getElementById('r-note').textContent = config.note;
  document.getElementById('r-issuer').textContent = config.issuer;
  document.getElementById('r-issuer-sub').innerHTML = config.issuerSub.replace(/\n/g, '<br>');

  document.getElementById('receipt-form-panel').style.display = 'none';
  document.getElementById('preview-area').style.display = 'block';
}

function goBack() {
  document.getElementById('preview-area').style.display = 'none';
  document.getElementById('receipt-form-panel').style.display = 'block';
}

// ===== PDF ダウンロード =====
async function downloadPDF() {
  const { jsPDF } = window.jspdf;
  const receipt = document.getElementById('receipt');
  const canvas = await html2canvas(receipt, {
    scale: 2,
    useCORS: true,
    backgroundColor: '#ffffff'
  });
  const imgData = canvas.toDataURL('image/jpeg', 0.95);
  const pdf = new jsPDF({
    orientation: 'portrait',
    unit: 'mm',
    format: 'a4'
  });
  const pageW = pdf.internal.pageSize.getWidth();
  const pageH = pdf.internal.pageSize.getHeight();
  const ratio = canvas.width / canvas.height;
  const imgW = pageW - 20;
  const imgH = imgW / ratio;
  const x = 10;
  const y = (pageH - imgH) / 2;
  pdf.addImage(imgData, 'JPEG', x, y, imgW, imgH);
  const addressee = document.getElementById('r-addressee').textContent.replace(' 御中','').replace(/[\s　]/g,'_');
  pdf.save('領収書_' + addressee + '.pdf');
}

// ===== 画像ダウンロード =====
async function downloadImage() {
  const receipt = document.getElementById('receipt');
  const canvas = await html2canvas(receipt, {
    scale: 2,
    useCORS: true,
    backgroundColor: '#ffffff'
  });
  const link = document.createElement('a');
  const addressee = document.getElementById('r-addressee').textContent.replace(' 御中','').replace(/[\s　]/g,'_');
  link.download = '領収書_' + addressee + '.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}
